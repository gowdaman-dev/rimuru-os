# ==============================================================================
# Rimuru OS — Hyprland Compositor Configuration
# ==============================================================================

# Monitor Setup
monitor=,preferred,auto,1

# Autostart Core Daemons & Services
exec-once = waybar &
exec-once = mako &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = rquickshare &
exec-once = rimuru-orchestratord &

# Input Setup
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# General Layout & Styling
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7dcfffbf) rgba(7aa2f7bf) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
    allow_tearing = false
}

# Decoration & Blurring
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }
    drop_shadow = true
    shadow_range = 15
    shadow_render_power = 3
    col.shadow = rgba(1a1b26ee)
}

# Animations
animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Window Rules
windowrulev2 = float, class:^(rimuru-store)$
windowrulev2 = size 950 680, class:^(rimuru-store)$
windowrulev2 = center, class:^(rimuru-store)$

windowrulev2 = float, class:^(rimuru-cockpit)$
windowrulev2 = size 1100 750, class:^(rimuru-cockpit)$
windowrulev2 = center, class:^(rimuru-cockpit)$

windowrulev2 = float, class:^(rquickshare)$
windowrulev2 = size 700 500, class:^(rquickshare)$

# Keybindings
$mainMod = SUPER

# Application Launchers
bind = $mainMod, Return, exec, ghostty -e tmux new-session -A -s rimuru
bind = $mainMod, T, exec, ghostty
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, S, exec, rimuru-store
bind = $mainMod, C, exec, rimuru-cockpit
bind = $mainMod SHIFT, S, exec, rquickshare
bind = $mainMod, E, exec, nautilus

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (1 - 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Media & Brightness Controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Screenshots with Preview Picker
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, P, exec, hyprland-preview-share-picker
