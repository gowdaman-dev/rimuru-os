# ==============================================================================
# Rimuru OS — Tmux Configuration
# ==============================================================================

# Use 256 colors & true color support
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Ergonomic Prefix (Ctrl-a)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality of Life
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi Keys for Copy Mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Ergonomic Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Agent Worker Pane Shortcut (Super-fast AI observer split)
bind A split-window -h -p 35 "rimuru cockpit --live || tail -f /var/log/rimuru/orchestrator.log"

# Rimuru Status Bar Styling
set -g status-position top
set -g status-style bg="#1a1b26",fg="#c0caf5"
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[bg=#7aa2f7,fg=#15161e,bold] RIMURU #[bg=#1a1b26,fg=#7aa2f7] #[fg=#7dcfff]#S #[fg=#414868]| "
set -g status-right "#[fg=#9ece6a]󰒋 #(pgrep -x rimuru-orchestratord >/dev/null && echo 'AI: Active' || echo 'AI: Idle') #[fg=#414868]| #[fg=#e0af68]%H:%M #[fg=#7aa2f7]%d-%b-%y "

setw -g window-status-format "#[fg=#565f89]#I:#W "
setw -g window-status-current-format "#[fg=#7dcfff,bold]#I:#W* "
